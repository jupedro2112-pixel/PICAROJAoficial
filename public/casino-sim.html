<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casino simulado</title>
<style>
:root{--r:#e60023;--t:#111;--m:#6b6b6b;--b:#e9e9e9}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--t);min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--b)}.top b{font-size:16px}.pill{font-size:12px;font-weight:800;color:var(--r);background:#ffe9ec;border-radius:999px;padding:5px 10px}
.wrap{padding:16px;max-width:520px;margin:0 auto;width:100%}.card{border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.bal{font-size:28px;font-weight:900}.m{color:var(--m);font-size:13px;line-height:1.45}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g div{aspect-ratio:1/1.2;border-radius:14px;background:linear-gradient(160deg,#1b1b2b,#3a0d1a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--r);color:#fff;font-weight:900;font-size:15px;padding:12px;margin-top:8px}
.btn.s{background:#fff;color:var(--t);border:1px solid var(--b)}
</style></head><body>
<div class="top"><b>🎰 1girox · simulado</b><span class="pill">ENTORNO DE PRUEBA</span></div>
<div class="wrap">
  <div class="card"><div class="m">Jugador</div><div style="font-weight:900;font-size:18px" id="u">—</div><div class="m" style="margin-top:8px">Saldo (del simulador)</div><div class="bal" id="bal">$ —</div><div class="m" id="rol"></div></div>
  <div class="card"><div class="m" style="margin-bottom:8px">Acá, en producción, se abre la web real de 1girox con tu sesión iniciada. Este casino es de mentira: sirve para probar cargas, retiros, regalos y la Carga rápida sin tocar la plataforma real.</div>
    <div class="g"><div>🎰</div><div>🃏</div><div>🎲</div><div>🐯</div><div>⚽</div><div>🎡</div></div>
    <button class="btn" onclick="bet()">Simular una apuesta de $1.000</button>
    <button class="btn s" onclick="load()">Actualizar saldo</button>
    <div class="m" id="msg" style="margin-top:8px"></div>
  </div>
</div>
<script>
(function(){
  var u=new URLSearchParams(location.search).get('u')||'';document.getElementById('u').textContent=u||'—';
  function fmt(n){return '$'+Math.round(Number(n)||0).toLocaleString('es-AR');}
  window.load=function(){fetch('/api/casino-sim/state?u='+encodeURIComponent(u)).then(function(r){return r.json();}).then(function(j){if(!j||!j.success){document.getElementById('msg').textContent=(j&&j.error)||'Sin datos';return;}document.getElementById('bal').textContent=fmt(j.balance);document.getElementById('rol').textContent=j.rolloverPending>0?'Rollover pendiente: '+fmt(j.rolloverPending):'Sin rollover pendiente';}).catch(function(){document.getElementById('msg').textContent='Sin conexión';});};
  window.bet=function(){fetch('/api/casino-sim/bet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:u,amount:1000})}).then(function(r){return r.json();}).then(function(j){document.getElementById('msg').textContent=j&&j.success?(j.won?'🎉 Ganaste '+fmt(j.delta):'😅 Perdiste '+fmt(-j.delta))+' · saldo '+fmt(j.balance):((j&&j.error)||'No se pudo');if(j&&j.success)document.getElementById('bal').textContent=fmt(j.balance);}).catch(function(){document.getElementById('msg').textContent='Sin conexión';});};
  load();
})();
</script></body></html>
